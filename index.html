<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>RunWise — Your Cart. Our Run.</title>
<link rel="stylesheet" href="styles.css?v=2">
<link rel="stylesheet" href="signup-legal-fix.css?v=2">
<script>
  // Capture Supabase's recovery marker before the auth client consumes/cleans the URL hash.
  // This prevents the temporary recovery session from being mistaken for a normal login.
  (() => {
    const recoveryUrl = `${window.location.search}${window.location.hash}`;
    if (/(?:[?#&])type=recovery(?:&|$)/i.test(recoveryUrl)) {
      sessionStorage.setItem('runwise_password_recovery', '1');
    }
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>
<script src="app.js?v=2"></script>
</body>
</html>
