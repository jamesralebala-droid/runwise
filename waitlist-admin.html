<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123F34"><title>RunWise Early-Access Signups</title><style>:root{--g:#123f34;--gold:#c9a34a;--iv:#f7f2e8}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--iv);color:#252a27}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0}.brand{font:700 28px Georgia;color:var(--g)}a{color:var(--g);font-weight:800}.card{background:#fff;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 12px 34px rgba(18,63,52,.09)}h1{font:700 40px Georgia;color:var(--g);margin:5px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat strong{display:block;font-size:36px;color:var(--g)}input,button{padding:12px 14px;border-radius:10px;border:1px solid #d7d0c3;font:inherit}button{background:var(--g);color:white;border:0;font-weight:800;cursor:pointer}.login{max-width:440px;margin:50px auto}.login input{width:100%;margin:7px 0}.login button{width:100%;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}.toolbar input{min-width:260px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;font-size:13px}th{color:var(--g);font-size:12px;text-transform:uppercase}.pill{display:inline-block;background:#edf3ef;color:var(--g);padding:5px 9px;border-radius:99px;font-weight:800}.error{color:#a12c22}.hidden{display:none}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}h1{font-size:32px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script></head><body><header class="wrap top"><div class="brand">RunWise Command Center</div><div><a href="index.html">Landing page</a> &nbsp; <a href="admin.html">Main admin</a></div></header><main class="wrap"><section id="loginCard" class="card login"><h1>Admin login</h1><p>Sign in with the same RunWise administrator account.</p><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button><p id="loginError" class="error"></p></form></section><section id="dashboard" class="hidden"><h1>Early-access signups</h1><p>Live signups from the public RunWise landing page.</p><div class="stats"><div class="card stat"><span>Total</span><strong id="total">0</strong></div><div class="card stat"><span>Customers</span><strong id="customers">0</strong></div><div class="card stat"><span>Runners</span><strong id="runners">0</strong></div><div class="card stat"><span>Both</span><strong id="both">0</strong></div></div><div class="card"><div class="toolbar"><input id="search" placeholder="Search name, phone, town or route"><div><button id="refresh">Refresh</button> <button id="signout">Sign out</button></div></div><p id="loadError" class="error"></p><div class="tablewrap"><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Email</th><th>Interest</th><th>Town</th><th>Route</th><th>Notes</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></main><script>function cfg(){const c=window.RUNWISE_CONFIG||window.runwiseConfig||window.CONFIG||{};return{url:c.supabaseUrl||c.SUPABASE_URL||window.SUPABASE_URL,key:c.supabaseAnonKey||c.SUPABASE_ANON_KEY||window.SUPABASE_ANON_KEY}}const c=cfg(),sb=c.url&&c.key?supabase.createClient(c.url,c.key):null,tables=['early_access_signups','waitlist_signups','waitlist'];let data=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){document.getElementById('loadError').textContent='';let last;for(const t of tables){const r=await sb.from(t).select('*').order('created_at',{ascending:false});if(!r.error){data=r.data||[];render();return}last=r.error;if(!/does not exist|schema cache/i.test(last.message||''))break}document.getElementById('loadError').textContent=last?.message||'Could not load signups.'}function render(){const q=document.getElementById('search').value.toLowerCase(),list=data.filter(x=>Object.values(x).some(v=>String(v??'').toLowerCase().includes(q)));document.getElementById('total').textContent=data.length;document.getElementById('customers').textContent=data.filter(x=>x.interest==='customer').length;document.getElementById('runners').textContent=data.filter(x=>x.interest==='runner').length;document.getElementById('both').textContent=data.filter(x=>x.interest==='both').length;document.getElementById('rows').innerHTML=list.map(x=>`<tr><td>${esc(x.created_at?new Date(x.created_at).toLocaleString():'')}</td><td><b>${esc(x.full_name)}</b></td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td><span class="pill">${esc(x.interest)}</span></td><td>${esc(x.city||x.town)}</td><td>${esc(x.route)}</td><td>${esc(x.notes)}</td></tr>`).join('')||'<tr><td colspan="8">No signups found.</td></tr>'}async function show(session){if(session){document.getElementById('loginCard').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');await load()}else{document.getElementById('loginCard').classList.remove('hidden');document.getElementById('dashboard').classList.add('hidden')}}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),r=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});document.getElementById('loginError').textContent=r.error?.message||'';if(!r.error)show(r.data.session)};document.getElementById('search').oninput=render;document.getElementById('refresh').onclick=load;document.getElementById('signout').onclick=async()=>{await sb.auth.signOut();show(null)};(async()=>{if(!sb){document.getElementById('loginError').textContent='Supabase configuration is missing.';return}const {data:{session}}=await sb.auth.getSession();show(session)})();</script></body></html>
