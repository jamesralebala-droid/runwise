<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#123F34" />
<title>RunWise — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script defer src="%BASE_URL%supabase.js"></script>
<script>
  // Capture Supabase's recovery marker before the auth client consumes/cleans the URL hash.
  // This prevents the temporary recovery session from being mistaken for a normal login.
  (() => {
    const recoveryUrl = `${window.location.search}${window.location.hash}`;
    if (/(?:[?#&])type=recovery(?:&|$)/i.test(recoveryUrl)) {
      sessionStorage.setItem('runwise_password_recovery', '1');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
