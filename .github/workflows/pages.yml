name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify GitHub Pages source is GitHub Actions
        # Guard: if Pages is set to "Deploy from a branch" (build_type=legacy), GitHub's
        # built-in builder publishes the RAW repository (app/index.html still points at
        # /src/main.tsx) and overwrites this workflow's built output — the app goes blank.
        # Fail loudly here instead of silently shipping a broken site.
        env:
          # gh does not pick up the workflow token automatically — it needs GH_TOKEN.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Authenticated GET — the workflow token's "pages: write" permission covers this read.
          if ! PAGES_JSON=$(gh api "repos/${{ github.repository }}/pages" 2>&1); then
            echo "::error::Could not read GitHub Pages settings: $PAGES_JSON"
            exit 1
          fi
          BUILD_TYPE=$(printf '%s' "$PAGES_JSON" | jq -r '.build_type // "unknown"')
          if [ "$BUILD_TYPE" != "workflow" ]; then
            echo "::error title=GitHub Pages misconfigured::build_type is '$BUILD_TYPE' (expected 'workflow')."
            echo "::error::Fix: repo → Settings → Pages → Build and deployment → Source → select 'GitHub Actions'. Otherwise GitHub publishes the raw repo (app/index.html with /src/main.tsx) over the built site and the app shows a blank page."
            exit 1
          fi
          echo "Pages source OK: build_type=workflow"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          cd admin && npm install --no-audit --no-fund
      - name: Build site
        # GitHub Pages serves the site under the repository subpath (e.g. /runwise/),
        # so the Vite build base is set to that subpath.
        run: RUNWISE_BASE=/${{ github.event.repository.name }}/ sh ./build.sh
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
